# Test configuration — H2 in-memory replaces MySQL for unit/integration tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable Outbox scheduler during tests (no Kafka broker available)
scheduling.enabled=false

# OAuth2 resource server (placeholders: tokens are not validated in these tests)
security.jwt.issuer=http://localhost:0/realms/test
security.jwt.jwk-set-uri=http://localhost:0/realms/test/certs
security.jwt.audience=transaction-service
