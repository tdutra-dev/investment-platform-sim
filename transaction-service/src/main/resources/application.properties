spring.application.name=transaction-service
server.port=8082

# MySQL — richiede Docker Compose attivo (docker compose up -d)
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:3306}/platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Kafka producer — richiede Docker Compose attivo
spring.kafka.bootstrap-servers=localhost:${KAFKA_PORT:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Outbox scheduler (disabilitato in test via scheduling.enabled=false)
scheduling.enabled=true

# Outbox: batch claiming, retry with exponential backoff, cleanup of SENT rows
outbox.batch-size=50
outbox.max-attempts=5
outbox.backoff.initial=1s
outbox.backoff.max=5m
outbox.retention=7d
outbox.publisher.fixed-delay-ms=5000
outbox.cleanup.fixed-delay-ms=3600000
