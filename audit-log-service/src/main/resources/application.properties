spring.application.name=audit-log-service
server.port=8083

# MongoDB — richiede Docker Compose attivo (docker compose up -d)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=auditlog

# Kafka consumer
spring.kafka.bootstrap-servers=localhost:${KAFKA_PORT:9092}
spring.kafka.consumer.group-id=audit-log-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# OAuth2 resource server (Keycloak realm "investment"): signature, issuer and audience are validated
security.jwt.issuer=http://localhost:${KEYCLOAK_PORT:8180}/realms/investment
security.jwt.jwk-set-uri=http://localhost:${KEYCLOAK_PORT:8180}/realms/investment/protocol/openid-connect/certs
security.jwt.audience=audit-log-service

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=audit-log-service
logging.pattern.level=%5p [eventId=%X{eventId:-}]
