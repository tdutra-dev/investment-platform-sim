spring.application.name=customer-service
server.port=8081

# MySQL — richiede Docker Compose attivo (docker compose up -d)
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:3306}/platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka producer (used only by the outbox scheduler)
spring.kafka.bootstrap-servers=localhost:${KAFKA_PORT:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
scheduling.enabled=true

# Outbox: batch claiming, retry with exponential backoff, cleanup of SENT rows
outbox.batch-size=50
outbox.max-attempts=5
outbox.backoff.initial=1s
outbox.backoff.max=5m
outbox.retention=7d
outbox.publisher.fixed-delay-ms=5000
outbox.cleanup.fixed-delay-ms=3600000

# OAuth2 resource server (Keycloak realm "investment"): signature, issuer and audience are validated
security.jwt.issuer=http://localhost:${KEYCLOAK_PORT:8180}/realms/investment
security.jwt.jwk-set-uri=http://localhost:${KEYCLOAK_PORT:8180}/realms/investment/protocol/openid-connect/certs
security.jwt.audience=customer-service

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=customer-service
logging.pattern.level=%5p [eventId=%X{eventId:-}]
